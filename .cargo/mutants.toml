# cargo-mutants configuration for TxWatch contracts workspace
# Exclude test files, test harnesses, integration tests, and support crates

examine_globs = [
    "contracts/alert-registry/src/lib.rs",
    "contracts/watcher-registry/src/lib.rs",
]

exclude_globs = [
    "contracts/alert-registry/src/proptests.rs",
    "contracts/integration-tests/**",
    "contracts/test-utils/**",
    "**/tests/**",
]

exclude_re = [
    "^#\\[cfg\\(test\\)\\]",
    "^\\s*mod tests \\{",
    "^\\s*mod regression_tests \\{",
]

minimum_test_timeout = 30
timeout_multiplier = 2
