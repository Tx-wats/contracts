[package]
name = "alert-registry"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Soroban smart contract for managing webhook alert configurations on Stellar"
license = "Apache-2.0"
repository = "https://github.com/Tx-wat/contracts"
homepage = "https://github.com/Tx-wat/contracts"
documentation = "https://docs.rs/alert-registry"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
testutils = ["soroban-sdk/testutils", "watcher-registry/testutils"]
watcher-gating = ["watcher-registry"]

[dependencies]
soroban-sdk = { workspace = true }
watcher-registry = { path = "../watcher-registry", optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
watcher-registry = { path = "../watcher-registry", features = ["testutils"] }
