[package]
name = "alert-registry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
alert-registry = { path = "..", features = ["testutils"] }
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[[bin]]
name = "validate_rule"
path = "fuzz_targets/validate_rule.rs"
test = false
doc = false

[workspace]
