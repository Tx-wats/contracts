name: Bindings e2e (quickstart local) (#434)

# Exercise the generated TypeScript bindings against a real deployed contract on a
# local Stellar network: sign and submit a real register_alert -> get_alert round-
# trip through the generated client, exercise BytesN<32> encoding of the webhook
# hash, and verify error decoding. Reuses the quickstart job pattern from #433.

on:
  pull_request:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'scripts/deploy.sh'
      - 'scripts/lib/common.sh'
      - 'scripts/update-spec-golden.sh'
      - 'scripts/spec-golden.sh'
      - 'contracts/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  bindings-e2e:
    name: Bindings e2e (quickstart local)
    runs-on: ubuntu-latest

    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
      STELLAR_CLI_VERSION: "28.0.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772115f6ec1 # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bindings-e2e-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bindings-e2e-${{ steps.rust.outputs.channel }}-

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Start Stellar quickstart (local mode)
        run: |
          docker rm -f quickstart-local 2>/dev/null || true
          docker run -d -p 8000:8000 --name quickstart-local stellar/quickstart --local --core-log-level error
          for i in $(seq 1 80); do
            if curl -s http://localhost:8000/ >/dev/null && curl -s http://localhost:8000/soroban-rpc >/dev/null; then
              echo "quickstart ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -s http://localhost:8000/ >/dev/null && echo "horizon: ok" || (echo "horizon down"; exit 1)
          curl -s http://localhost:8000/soroban-rpc >/dev/null && echo "soroban-rpc: ok" || (echo "soroban-rpc down"; exit 1)

      - name: Build + optimize release WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --locked -p alert-registry -p watcher-registry
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/alert_registry.wasm
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/watcher_registry.wasm

      - name: Configure local network + identity
        run: |
          stellar network add local --rpc-url http://localhost:8000/soroban-rpc --network-passphrase "Standalone Network ; February 2017"
          stellar keys generate deployer --network local
          ADMIN_ADDR=$(stellar keys address deployer)
          echo "admin=$ADMIN_ADDR"
          curl -s "http://localhost:8000/friendbot?addr=${ADMIN_ADDR}" > /dev/null

      - name: Deploy alert registry to local quickstart
        env:
          NETWORK: local
          RPC_URL: http://localhost:8000/soroban-rpc
          NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          FRIENDBOT_URL: http://localhost:8000/friendbot
          STELLAR_IDENTITY: deployer
          IDENTITY: deployer
        run: |
          set -o pipefail
          bash scripts/deploy.sh

      - name: Install Node + run bindings e2e
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install npm deps + build bindings
        working-directory: bindings/alert-registry
        run: |
          npm ci || npm install
          npm run build
      - name: Run bindings e2e test
        working-directory: bindings/alert-registry
        env:
          SOROBAN_RPC_URL: http://localhost:8000/soroban-rpc
          NETWORKS_TESTNET_RPC_URL: http://localhost:8000/soroban-rpc
        run: |
          npm test

      - name: Tear down quickstart
        if: always()
        run: |
          docker stop quickstart-local 2>/dev/null || true
          docker rm quickstart-local 2>/dev/null || true
