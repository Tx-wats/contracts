name: Deploy e2e (quickstart local) (#433)

# Both contracts get deployed against a live local Stellar network (quickstart)
# and verified end-to-end: deploy.sh runs cleanly, get_configuration + get_watchers
# return sensible results, and upgrade.sh completes an upgrade. Catches the
# broken deploy/upgrade scripts (#352, #353, #354) before any release.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-e2e.yml'
      - 'scripts/deploy.sh'
      - '.github/quickstart/Dockerfile'
      - 'scripts/deployment_outputs.py'
      - 'scripts/upgrade.sh'
      - 'scripts/lib/common.sh'
      - 'scripts/spec-golden.sh'
      - 'scripts/update-spec-golden.sh'
      - 'contracts/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  deploy-e2e:
    name: Deploy e2e (quickstart local)
    runs-on: ubuntu-latest

    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
      STELLAR_CLI_VERSION: "28.0.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772115f6ec1 # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deploy-e2e-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-deploy-e2e-${{ steps.rust.outputs.channel }}-

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Start Stellar quickstart (local mode)
        run: |
          docker rm -f quickstart-local 2>/dev/null || true
          QUICKSTART_IMAGE=$(awk '/^FROM /{print $2}' .github/quickstart/Dockerfile)
          docker run -d -p 8000:8000 --name quickstart-local "$QUICKSTART_IMAGE" --local --core-log-level error
          # wait for Horizon + Soroban RPC to be healthy
          for i in $(seq 1 80); do
            if curl -s http://localhost:8000/ >/dev/null && curl -s http://localhost:8000/soroban-rpc >/dev/null; then
              echo "quickstart ready after ${i}s"
              break
            fi
            sleep 2
          done
          # final check
          curl -s http://localhost:8000/ >/dev/null && echo "horizon: ok" || (echo "horizon down"; exit 1)
          curl -s http://localhost:8000/soroban-rpc >/dev/null && echo "soroban-rpc: ok" || (echo "soroban-rpc down"; exit 1)

      - name: Build + optimize release WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --locked -p alert-registry -p watcher-registry
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/alert_registry.wasm
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/watcher_registry.wasm

      - name: Configure local network + identity
        run: |
          stellar network add local --rpc-url http://localhost:8000/soroban-rpc --network-passphrase "Standalone Network ; February 2017"
          stellar keys generate deployer --network local
          ADMIN_ADDR=$(stellar keys address deployer)
          echo "admin=$ADMIN_ADDR"
          # fund the deployer account from the local friendbot
          curl -s "http://localhost:8000/friendbot?addr=${ADMIN_ADDR}" > /dev/null

      - name: Run deploy.sh against local quickstart
        env:
          NETWORK: local
          RPC_URL: http://localhost:8000/soroban-rpc
          NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          FRIENDBOT_URL: http://localhost:8000/friendbot
          STELLAR_IDENTITY: deployer
          IDENTITY: deployer
        run: |
          set -o pipefail
          bash scripts/deploy.sh --watcher "$(stellar keys address deployer)"
          bash scripts/deploy.sh | tee "$RUNNER_TEMP/deploy.log"

      - name: Capture deployed contract IDs from deploy.sh output
        id: deployed
        run: |
          python3 -I scripts/deployment_outputs.py < "$RUNNER_TEMP/deploy.log" >> "$GITHUB_OUTPUT"

      - name: Verify deployed contracts via get_configuration + get_watchers
        env:
          NETWORK: local
          RPC_URL: http://localhost:8000/soroban-rpc
          NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          STELLAR_IDENTITY: deployer
          IDENTITY: deployer
          ALERT_ID: ${{ steps.deployed.outputs.alert_id }}
          WATCHER_ID: ${{ steps.deployed.outputs.watcher_id }}
        run: |
          set -o pipefail
          ADMIN_ADDR=$(stellar keys address deployer)
          invoke() {
            stellar contract invoke --id "$1" --source deployer --network local \
              --rpc-url "$RPC_URL" --network-passphrase "$NETWORK_PASSPHRASE" -- "${@:2}"
          }

          ALERT_CONFIG=$(invoke "$ALERT_ID" get_configuration)
          echo "alert get_configuration: $ALERT_CONFIG"
          echo "$ALERT_CONFIG" | ADMIN_ADDR="$ADMIN_ADDR" WATCHER_ID="$WATCHER_ID" python3 -I -c '
          import json, os, sys
          config = json.load(sys.stdin)
          assert config["admin"] == os.environ["ADMIN_ADDR"], f"admin mismatch: {config}"
          assert config["paused"] is False, f"alert registry paused: {config}"
          assert config["watcher_registry"] == os.environ["WATCHER_ID"], f"watcher registry not gated: {config}"
          '

          WATCHERS=$(invoke "$WATCHER_ID" get_watchers)
          echo "watcher get_watchers: $WATCHERS"
          echo "$WATCHERS" | python3 -I -c '
          import json, sys
          watchers = json.load(sys.stdin)
          assert isinstance(watchers, list), f"get_watchers did not return a list: {watchers}"
          '

          WATCHER_ADMIN=$(invoke "$WATCHER_ID" get_admin)
          [[ "$WATCHER_ADMIN" == *"$ADMIN_ADDR"* ]] || { echo "watcher admin mismatch: expected $ADMIN_ADDR, got $WATCHER_ADMIN" >&2; exit 1; }
          echo "verify OK"

      - name: Upgrade deployed alert registry and verify on-chain WASM hash
        env:
          NETWORK: local
          RPC_URL: http://localhost:8000/soroban-rpc
          NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          STELLAR_IDENTITY: deployer
          IDENTITY: deployer
          ALERT_ID: ${{ steps.deployed.outputs.alert_id }}
        run: |
          set -o pipefail
          ADMIN_ADDR=$(stellar keys address deployer)
          # upgrade the already-deployed alert registry to the same WASM hash (idempotent smoke)
          NEW_HASH=$(sha256sum target/wasm32-unknown-unknown/release/alert_registry.optimized.wasm | awk '{print $1}')
          echo "upgrading alert id=$ALERT_ID to wasm=$NEW_HASH"
          stellar contract invoke \
            --id "$ALERT_ID" \
            --source deployer \
            --network local \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- upgrade \
            --admin "$ADMIN_ADDR" \
            --new_wasm_hash "$NEW_HASH"
          # fetch the code the contract now runs and check it matches the expected hash
          stellar contract fetch --id "$ALERT_ID" --network local \
            --rpc-url "$RPC_URL" --network-passphrase "$NETWORK_PASSPHRASE" \
            --out-file "$RUNNER_TEMP/alert_after_upgrade.wasm"
          ON_CHAIN_HASH=$(sha256sum "$RUNNER_TEMP/alert_after_upgrade.wasm" | awk '{print $1}')
          [[ "$ON_CHAIN_HASH" == "$NEW_HASH" ]] || { echo "on-chain hash $ON_CHAIN_HASH != expected $NEW_HASH" >&2; exit 1; }
          echo "upgrade OK: on-chain wasm hash $ON_CHAIN_HASH"

      - name: Tear down quickstart
        if: always()
        run: |
          docker stop quickstart-local 2>/dev/null || true
          docker rm quickstart-local 2>/dev/null || true
