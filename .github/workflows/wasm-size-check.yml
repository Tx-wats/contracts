name: WASM Binary Size Check

# Issue #286 — Limit push to main and prevent duplicate PR runs with concurrency
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Issue #284 — Top-level least-privilege permissions
permissions:
  contents: read

# Issue #286 — Cancel in-progress runs on new commits
concurrency:
  group: wasm-size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_SIZE_LIMIT_KB: 60
  STELLAR_CLI_VERSION: "28.0.0"

jobs:
  wasm-size:
    name: Check WASM binary sizes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # dtolnay/rust-toolchain requires an explicit toolchain input; it does not
      # read rust-toolchain.toml. Parse the pin so that file stays the one source
      # of truth for the Rust version.
      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown

      # Issue #285, #286 — Use prebuilt pinned Stellar CLI instead of building from source
      - name: Install Stellar CLI
      # Issue #285 — Pin Stellar CLI version
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "28.0.0"
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Build WASM binaries
        run: cargo build --release --target wasm32-unknown-unknown --locked -p alert-registry -p watcher-registry

      # Optimize contracts to match the deploy path (deploy.sh)
      - name: Optimize WASM binaries
        run: |
          for w in alert_registry watcher_registry; do
            stellar contract optimize --wasm "target/wasm32-unknown-unknown/release/$w.wasm"
          done

      - name: Check binary sizes
        run: |
          LIMIT=$(( ${{ env.WASM_SIZE_LIMIT_KB }} * 1024 ))
          FAILED=0

          for wasm in target/wasm32-unknown-unknown/release/*.optimized.wasm; do
            SIZE=$(stat -c%s "$wasm")
            SIZE_KB=$(( SIZE / 1024 ))
            echo "$wasm: ${SIZE_KB}KB"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "ERROR: $wasm exceeds limit of ${{ env.WASM_SIZE_LIMIT_KB }}KB (actual: ${SIZE_KB}KB)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
