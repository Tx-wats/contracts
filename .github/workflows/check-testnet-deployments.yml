name: Check Testnet Deployments Liveness

# Periodic scheduled check ensuring that deployed testnet contract addresses
# recorded in DEPLOYMENTS.md remain live and have not been wiped by a testnet reset.
on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual execution from GitHub Actions UI

# Issue #284 — Top-level least-privilege permissions
permissions:
  contents: read
  issues: write

concurrency:
  group: check-testnet-deployments
  cancel-in-progress: true

jobs:
  check-testnet-liveness:
    name: Verify Testnet Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run Testnet Deployment Liveness Check
        id: liveness
        run: |
          chmod +x scripts/check-testnet-deployments.sh
          ./scripts/check-testnet-deployments.sh DEPLOYMENTS.md

      - name: Report liveness result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVENESS_OUTCOME: ${{ steps.liveness.outcome }}
        run: |
          title="Testnet deployment liveness check failed"
          issue_number=$(gh issue list \
            --state open \
            --search "in:title \"$title\"" \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

          if [[ "$LIVENESS_OUTCOME" == "failure" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create \
                --title "$title" \
                --body "The scheduled testnet liveness check failed. Review the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) logs, then follow the [testnet reset recovery guide](docs/deployment-guide.md)."
            else
              echo "Existing liveness issue: #$issue_number"
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --comment "The testnet liveness check passed in [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
