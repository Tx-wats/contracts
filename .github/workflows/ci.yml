name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #99 — WASM build verification
      # --locked enforces the committed Cargo.lock so CI cannot silently resolve
      # dependencies that exceed the toolchain pinned in rust-toolchain.toml.
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown --locked -p alert-registry -p watcher-registry

      # Issue #102 — Test suite verification
      - name: Test
        run: cargo test --workspace --locked

      # Issue #100 — Clippy lint check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Issue #101 — Formatting check
      - name: Format check
        run: cargo fmt --check

      # Issue #105 — Dependency vulnerability scanning
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit
