name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain requires an explicit toolchain input; it does not
      # read rust-toolchain.toml. Parse the pin so that file stays the one source
      # of truth for the Rust version.
      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #99 — WASM build verification
      # --locked enforces the committed Cargo.lock so CI cannot silently resolve
      # dependencies that exceed the toolchain pinned in rust-toolchain.toml.
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown --locked -p alert-registry -p watcher-registry

      # Issue #102 — Test suite verification
      - name: Test
        run: cargo test --workspace --locked

      # Issue #100 — Clippy lint check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Issue #101 — Formatting check
      - name: Format check
        run: cargo fmt --check

      # Issue #105 — Dependency vulnerability scanning.
      # cargo-audit's current release requires a newer rustc than the toolchain
      # pinned in rust-toolchain.toml, so run the advisory scan through the
      # RustSec action rather than compiling the binary against the pin.
      - name: Cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
