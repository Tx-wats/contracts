name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain requires an explicit toolchain input; it does not
      # read rust-toolchain.toml. Parse the pin so that file stays the one source
      # of truth for the Rust version.
      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ steps.rust.outputs.channel }}-

      # Issue #99 — WASM build verification
      # --locked enforces the committed Cargo.lock so CI cannot silently resolve
      # dependencies that exceed the toolchain pinned in rust-toolchain.toml.
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown --locked -p alert-registry -p watcher-registry

      # Issue #102 — Test suite verification
      - name: Test
        run: cargo test --workspace --locked

      # Issue #100 — Clippy lint check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Issue #101 — Formatting check
      - name: Format check
        run: cargo fmt --check

      # Issue #122 — Every hand-written public item must be documented
      # (missing_docs) and every intra-doc link must resolve
      # (rustdoc::broken_intra_doc_links).
      - name: Check doc comments
        run: bash scripts/check-docs.sh

      # Issue #121 & #285 — README snippets must call functions (and pass arguments)
      # that exist in the compiled contract spec. Pinned Stellar CLI version.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "28.0.0"
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Check README snippets against contract spec
        run: bash scripts/check-readme-snippets.sh

  # Issue #107, #281 — MSRV verification
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.88 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: wasm32-unknown-unknown

      - name: Verify rustc version
        run: rustc --version

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Check workspace (MSRV)
        run: cargo check --workspace --locked

  # Issue #111, #282 — Verify events documentation matches source emissions
  docs-check:
    name: Check events documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check events documentation
        run: bash scripts/check-events-doc.sh

  # Issue #103, #282 — Code coverage reporting on pinned toolchain with llvm-tools-preview
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Issue #104, #282 — Shell script linting
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  # Issue #105 — Dependency vulnerability scanning.
  audit:
    runs-on: ubuntu-latest

    # rust-toolchain.toml applies to any cargo run from this checkout, so it
    # would pull the audit back onto the pinned toolchain even after installing
    # stable. RUSTUP_TOOLCHAIN overrides the file for this job only.
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

  # Issue #102 — PR-time dependency diffing and review
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
