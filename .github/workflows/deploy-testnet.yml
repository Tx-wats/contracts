name: Deploy to Testnet

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-testnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Issue #124 — refuse to release a tag that CHANGELOG.md does not document.
      - name: Require a CHANGELOG section for this tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/check-changelog-release.sh "$RELEASE_TAG"

      # dtolnay/rust-toolchain requires an explicit toolchain input; it does not
      # read rust-toolchain.toml. Parse the pin so that file stays the one source
      # of truth for the Rust version.
      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown

      # Issue #285 — Pin Stellar CLI version
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "28.0.0"
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      # Issue #288 — Import persistent testnet deployer key if configured
      - name: Provision Testnet Deployer Key
        env:
          TESTNET_DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
        run: |
          if [ -n "$TESTNET_DEPLOYER_SECRET" ]; then
            echo "Importing persistent testnet deployer key from secret..."
            stellar keys add deployer --secret-key <<< "$TESTNET_DEPLOYER_SECRET" || true
          fi

      - name: Deploy contracts
        id: deploy
        env:
          STELLAR_IDENTITY: deployer
        run: |
          OUTPUT=$(bash scripts/deploy.sh 2>&1)
          echo "$OUTPUT"
          ALERT_ID=$(echo "$OUTPUT" | grep "Alert Registry deployed:" | awk '{print $NF}')
          WATCHER_ID=$(echo "$OUTPUT" | grep "Watcher Registry deployed:" | awk '{print $NF}')
          ALERT_HASH=$(echo "$OUTPUT" | grep "Alert Registry:" | tail -1 | awk '{print $NF}')
          WATCHER_HASH=$(echo "$OUTPUT" | grep "Watcher Registry:" | tail -1 | awk '{print $NF}')
          echo "alert_id=$ALERT_ID" >> "$GITHUB_OUTPUT"
          echo "watcher_id=$WATCHER_ID" >> "$GITHUB_OUTPUT"
          echo "alert_hash=$ALERT_HASH" >> "$GITHUB_OUTPUT"
          echo "watcher_hash=$WATCHER_HASH" >> "$GITHUB_OUTPUT"

      # Issue #289 — Use update_deployments.py to update DEPLOYMENTS.md
      - name: Update DEPLOYMENTS.md
        run: |
          python3 scripts/update_deployments.py \
            --network testnet \
            --alert-id "${{ steps.deploy.outputs.alert_id }}" \
            --watcher-id "${{ steps.deploy.outputs.watcher_id }}" \
            --alert-hash "${{ steps.deploy.outputs.alert_hash }}" \
            --watcher-hash "${{ steps.deploy.outputs.watcher_hash }}" \
            --tag "${{ github.ref_name }}"

      - name: Create Pull Request with updated DEPLOYMENTS.md
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update DEPLOYMENTS.md for ${{ github.ref_name }}"
          branch: "deploy/update-deployments-${{ github.ref_name }}"
          title: "chore: update DEPLOYMENTS.md for ${{ github.ref_name }}"
          body: |
            Automated update of `DEPLOYMENTS.md` after deploying to testnet.

            **Tag:** `${{ github.ref_name }}`
            **Alert Registry:** `${{ steps.deploy.outputs.alert_id }}` (WASM Hash: `${{ steps.deploy.outputs.alert_hash }}`)
            **Watcher Registry:** `${{ steps.deploy.outputs.watcher_id }}` (WASM Hash: `${{ steps.deploy.outputs.watcher_hash }}`)

            Please review the deployment addresses before merging.
          labels: deployment
