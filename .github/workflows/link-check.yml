name: Link Check

# Internal links and #anchors are checked on every PR and push to main.
# External links are checked weekly (and on demand) so that third-party
# outages do not block unrelated changes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC, matching the Dependabot schedule
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Issue #452 — Top-level least-privilege permissions
permissions:
  contents: read

jobs:
  internal-links:
    name: Check internal links and anchors
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --offline .
          fail: true

  external-links:
    name: Check external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check all links
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config .lychee.toml .
          fail: true
