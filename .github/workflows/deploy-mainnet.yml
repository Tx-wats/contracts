name: Deploy to Mainnet

# Issue #290 — Restrict dispatch to tags or require tag verification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (e.g. v0.2.0)'
        required: true

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: mainnet-production
      url: https://stellar.expert/explorer/public

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Verify release tag
        run: |
          echo "Deploying ref: ${{ github.event.inputs.release_tag }}"
          git describe --exact-match --tags HEAD || {
            echo "ERROR: Ref ${{ github.event.inputs.release_tag }} is not a tagged release"
            exit 1
          }

      - name: Resolve pinned toolchain
        id: rust
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown

      # Issue #290 — Pre-deployment test verification
      - name: Run test suite verification
        run: cargo test --workspace --locked

      # Issue #285 — Pin Stellar CLI version
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "28.0.0"
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      # Issue #287 — Provision Mainnet Deployer Key from secret
      - name: Provision Mainnet Deployer Key
        env:
          MAINNET_DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
        run: |
          if [ -z "$MAINNET_DEPLOYER_SECRET" ]; then
            echo "Error: MAINNET_DEPLOYER_SECRET secret is not set in mainnet-production environment" >&2
            exit 1
          fi
          echo "Provisioning deployer identity from secret..."
          stellar keys add deployer --secret-key <<< "$MAINNET_DEPLOYER_SECRET"

      - name: Deploy contracts
        id: deploy
        env:
          STELLAR_IDENTITY: deployer
          NETWORK: mainnet
        run: |
          OUTPUT=$(bash scripts/deploy.sh --network mainnet 2>&1)
          echo "$OUTPUT"
          ALERT_ID=$(echo "$OUTPUT" | grep "Alert Registry deployed:" | awk '{print $NF}')
          WATCHER_ID=$(echo "$OUTPUT" | grep "Watcher Registry deployed:" | awk '{print $NF}')
          ALERT_HASH=$(echo "$OUTPUT" | grep "Alert Registry:" | tail -1 | awk '{print $NF}')
          WATCHER_HASH=$(echo "$OUTPUT" | grep "Watcher Registry:" | tail -1 | awk '{print $NF}')

          echo "alert_id=$ALERT_ID" >> "$GITHUB_OUTPUT"
          echo "watcher_id=$WATCHER_ID" >> "$GITHUB_OUTPUT"
          echo "alert_hash=$ALERT_HASH" >> "$GITHUB_OUTPUT"
          echo "watcher_hash=$WATCHER_HASH" >> "$GITHUB_OUTPUT"

      # Issue #289 — Use update_deployments.py script to reliably update Markdown tables
      - name: Update DEPLOYMENTS.md
        run: |
          python3 scripts/update_deployments.py \
            --network mainnet \
            --alert-id "${{ steps.deploy.outputs.alert_id }}" \
            --watcher-id "${{ steps.deploy.outputs.watcher_id }}" \
            --alert-hash "${{ steps.deploy.outputs.alert_hash }}" \
            --watcher-hash "${{ steps.deploy.outputs.watcher_hash }}" \
            --tag "${{ github.event.inputs.release_tag }}" \
            --notes "Production mainnet release"

      # Issue #290 — Include WASM hashes in PR body
      - name: Create Pull Request with updated DEPLOYMENTS.md
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update DEPLOYMENTS.md for mainnet deployment (${{ github.event.inputs.release_tag }})"
          branch: "deploy/mainnet"
          title: "chore: update DEPLOYMENTS.md for mainnet deployment (${{ github.event.inputs.release_tag }})"
          body: |
            Automated update of `DEPLOYMENTS.md` after mainnet deployment.

            ### Deployed Contract Details
            - **Release Tag:** `${{ github.event.inputs.release_tag }}`
            - **Alert Registry:** `${{ steps.deploy.outputs.alert_id }}` (WASM Hash: `${{ steps.deploy.outputs.alert_hash }}`)
            - **Watcher Registry:** `${{ steps.deploy.outputs.watcher_id }}` (WASM Hash: `${{ steps.deploy.outputs.watcher_hash }}`)

            Please verify the deployed contracts on Stellar Expert before merging.
          labels: deployment, mainnet
